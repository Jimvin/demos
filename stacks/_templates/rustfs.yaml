---
releaseName: rustfs
name: rustfs
repo:
  name: rustfs
  url: https://charts.rustfs.com/
version: 0.0.78
  # additionalLabels:
  #   stackable.tech/vendor: Stackable
  # podLabels:
  #   stackable.tech/vendor: Stackable
options:
  ingress:
    enabled: false
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  storageclass:
    name: ""
  secret:
    rustfs:
      access_key: "{{ rustfsAdminUsername }}"
      secret_key: "{{ rustfsAdminPassword }}"
  