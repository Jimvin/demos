---
apiVersion: druid.stackable.tech/v1alpha1
kind: DruidCluster
metadata:
  name: druid
spec:
  image:
    productVersion: 34.0.0
  clusterConfig:
    zookeeperConfigMapName: druid-znode
    metadataStorageDatabase:
      dbType: postgresql
      connString: jdbc:postgresql://postgresql-druid/druid
      host: postgresql-druid
      port: 5432
      credentialsSecret: druid-db-credentials
    deepStorage:
      s3:
        bucket:
          inline:
            bucketName: demo
            connection:
              inline:
                host: garage
                port: 3900
                accessStyle: Path
                credentials:
                  secretClass: druid-s3-credentials
        baseKey: data
  brokers:
    roleConfig:
      listenerClass: external-stable
    roleGroups:
      default:
        replicas: 1
  coordinators:
    roleConfig:
      listenerClass: external-stable
    roleGroups:
      default:
        replicas: 1
  historicals:
    roleGroups:
      default:
        replicas: 2
        config:
          resources:
            cpu:
              min: "1"
              max: "2"
            memory:
              limit: 4Gi
            storage:
              segmentCache:
                emptyDir:
                  capacity: 8Gi
  middleManagers:
    roleGroups:
      default:
        replicas: 1
        config:
          resources:
            cpu:
              min: "1"
              max: "4" # Need enough CPU cores to run multiple ingestion jobs at once
            memory:
              limit: 4Gi
  routers:
    roleConfig:
      listenerClass: external-stable
    roleGroups:
      default:
        replicas: 1
---
apiVersion: zookeeper.stackable.tech/v1alpha1
kind: ZookeeperZnode
metadata:
  name: druid-znode
spec:
  clusterRef:
    name: zookeeper
